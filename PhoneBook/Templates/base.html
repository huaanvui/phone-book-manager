<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phone Book{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='phonebook.css') }}">
  <script src="{{ url_for('static', filename='phonebook.js') }}" defer></script>
</head>
<body>
<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="{{ url_for('index') }}">Phone Book</a>
    {% if g.user %}
    <div class="account">
      <span>{{ g.user.full_name }}</span>
      <form method="post" action="{{ url_for('logout') }}">
        {% include 'csrf.html' %}
        <button class="quiet">Log out</button>
      </form>
    </div>
    {% endif %}
  </div>
</header>
<main class="shell">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="notice {{ category }}" role="status">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
